plugins {
    id 'com.android.library'
}

android {
    namespace 'com.ojilon.javaide.core'
    compileSdk 36

    ndkVersion "29.0.14206865"

    defaultConfig {
        minSdk 26
        targetSdk 34

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            def abiProperty = project.findProperty("aurora.abiFilters") as String
            if (abiProperty != null && !abiProperty.trim().isEmpty()) {
                abiFilters.clear()
                abiFilters.addAll(abiProperty.split(",").collect { it.trim() }.findAll { !it.isEmpty() })
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++23"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Packaging: ECJ is pure Java; keep it
    packaging {
        resources {
            excludes += ['META-INF/ECLIPSE_.RSA', 'META-INF/ECLIPSE_.SF']
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'

    // Eclipse Compiler for Java — standalone batch compiler
    implementation 'org.eclipse.jdt:ecj:3.42.0'
}
