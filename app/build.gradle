plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ojilon.javaide'
    compileSdk 36

    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.ojilon.javaide"
        minSdk 26
        targetSdk 34

        versionCode project.property("app.versionCode").toInteger()
        versionName project.property("app.versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            def abiProperty = project.findProperty("aurora.abiFilters") as String
            if (abiProperty != null && !abiProperty.trim().isEmpty()) {
                abiFilters.clear()
                abiFilters.addAll(abiProperty.split(",").collect { it.trim() }.findAll { !it.isEmpty() })
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
